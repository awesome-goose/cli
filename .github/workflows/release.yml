name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
          cache-dependency-path: go.sum

      - name: Run tests
        run: go test ./... -v -race -coverprofile=coverage.out

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

  build:
    name: Build and Release
    runs-on: ubuntu-latest
    needs: test

    strategy:
      matrix:
        include:
          # Linux
          - goos: linux
            goarch: amd64
            suffix: ""
          - goos: linux
            goarch: arm64
            suffix: ""
          - goos: linux
            goarch: "386"
            suffix: ""
          - goos: linux
            goarch: arm
            suffix: ""
          # macOS
          - goos: darwin
            goarch: amd64
            suffix: ""
          - goos: darwin
            goarch: arm64
            suffix: ""
          # Windows
          - goos: windows
            goarch: amd64
            suffix: ".exe"
          - goos: windows
            goarch: arm64
            suffix: ".exe"
          - goos: windows
            goarch: "386"
            suffix: ".exe"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
          cache-dependency-path: go.sum

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          OUTPUT_NAME="goose-${{ steps.version.outputs.VERSION }}-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }}"
          go build -ldflags="-s -w -X main.VERSION=${{ steps.version.outputs.VERSION }}" -o "./dist/${OUTPUT_NAME}" .

      - name: Create archive (Unix)
        if: matrix.goos != 'windows'
        run: |
          cd dist
          ARCHIVE_NAME="goose-${{ steps.version.outputs.VERSION }}-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz"
          tar -czvf "${ARCHIVE_NAME}" "goose-${{ steps.version.outputs.VERSION }}-${{ matrix.goos }}-${{ matrix.goarch }}"
          rm "goose-${{ steps.version.outputs.VERSION }}-${{ matrix.goos }}-${{ matrix.goarch }}"

      - name: Create archive (Windows)
        if: matrix.goos == 'windows'
        run: |
          cd dist
          ARCHIVE_NAME="goose-${{ steps.version.outputs.VERSION }}-${{ matrix.goos }}-${{ matrix.goarch }}.zip"
          zip "${ARCHIVE_NAME}" "goose-${{ steps.version.outputs.VERSION }}-${{ matrix.goos }}-${{ matrix.goarch }}.exe"
          rm "goose-${{ steps.version.outputs.VERSION }}-${{ matrix.goos }}-${{ matrix.goarch }}.exe"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: goose-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          retention-days: 1

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Goose CLI ${{ steps.version.outputs.VERSION }}
          body: |
            ## Goose CLI ${{ steps.version.outputs.VERSION }}

            ### Installation

            Download the appropriate archive for your operating system and architecture below.

            #### Linux

            ```bash
            # Download (replace architecture as needed: amd64, arm64, 386, arm)
            curl -LO https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.VERSION }}/goose-${{ steps.version.outputs.VERSION }}-linux-amd64.tar.gz

            # Extract
            tar -xzf goose-${{ steps.version.outputs.VERSION }}-linux-amd64.tar.gz

            # Make executable and move to PATH
            chmod +x goose-${{ steps.version.outputs.VERSION }}-linux-amd64
            sudo mv goose-${{ steps.version.outputs.VERSION }}-linux-amd64 /usr/local/bin/goose

            # Verify installation
            goose --version
            ```

            **Available archives:**
            - `linux-amd64` - Linux 64-bit
            - `linux-arm64` - Linux ARM 64-bit
            - `linux-386` - Linux 32-bit
            - `linux-arm` - Linux ARM 32-bit

            #### macOS

            **Apple Silicon (M1/M2/M3):**
            ```bash
            curl -LO https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.VERSION }}/goose-${{ steps.version.outputs.VERSION }}-darwin-arm64.tar.gz
            tar -xzf goose-${{ steps.version.outputs.VERSION }}-darwin-arm64.tar.gz
            chmod +x goose-${{ steps.version.outputs.VERSION }}-darwin-arm64
            sudo mv goose-${{ steps.version.outputs.VERSION }}-darwin-arm64 /usr/local/bin/goose
            goose --version
            ```

            **Intel Mac:**
            ```bash
            curl -LO https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.VERSION }}/goose-${{ steps.version.outputs.VERSION }}-darwin-amd64.tar.gz
            tar -xzf goose-${{ steps.version.outputs.VERSION }}-darwin-amd64.tar.gz
            chmod +x goose-${{ steps.version.outputs.VERSION }}-darwin-amd64
            sudo mv goose-${{ steps.version.outputs.VERSION }}-darwin-amd64 /usr/local/bin/goose
            goose --version
            ```

            > **Tip:** Run `uname -m` to check your architecture. `arm64` = Apple Silicon, `x86_64` = Intel.

            #### Windows

            1. Download the `.zip` file for your architecture
            2. Extract the archive
            3. Move `goose.exe` to a directory in your PATH (e.g., `C:\Program Files\goose\`)
            4. Add to PATH via System Properties → Environment Variables

            Or via PowerShell:
            ```powershell
            # Download
            Invoke-WebRequest -Uri "https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.VERSION }}/goose-${{ steps.version.outputs.VERSION }}-windows-amd64.zip" -OutFile "goose.zip"

            # Extract
            Expand-Archive -Path "goose.zip" -DestinationPath "."

            # Move to Program Files (run as Administrator)
            New-Item -ItemType Directory -Force -Path "C:\Program Files\goose"
            Move-Item "goose-${{ steps.version.outputs.VERSION }}-windows-amd64.exe" "C:\Program Files\goose\goose.exe"

            # Add to PATH (requires restart or new terminal)
            [Environment]::SetEnvironmentVariable("Path", $env:Path + ";C:\Program Files\goose", "Machine")
            ```

            **Available archives:**
            - `windows-amd64` - Windows 64-bit
            - `windows-arm64` - Windows ARM 64-bit
            - `windows-386` - Windows 32-bit

            ### Checksums

            SHA256 checksums are available in `checksums.txt`. Verify your download:

            ```bash
            # Linux/macOS
            sha256sum -c checksums.txt --ignore-missing

            # Windows PowerShell
            (Get-FileHash goose.zip -Algorithm SHA256).Hash
            ```

          files: |
            dist/*
          draft: false
          prerelease: ${{ contains(steps.version.outputs.VERSION, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
